# Tests and builds SuperPOS with PyInstaller on every push/PR and on version tags.
#
# Two jobs: `test` runs the suite, `build` (PyInstaller + self-test + artifact)
# only starts once every platform's tests have passed, so a red test shows up
# on its own and no installer is produced from broken code.
#
# Each matrix entry is one platform; adding Linux later means uncommenting its
# entry (and installing its system packages, see superpos.spec). Artifacts are
# named SuperPOS-<version>-<platform> so the installer step and the in-app
# updater can pick the right download per platform.
#
# A release is made by tagging the commit "v" + app/__version__.py; the build
# fails if the two disagree.
#
# Still to add: publishing a GitHub Release on tags.

name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # - os: ubuntu-22.04
          #   platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libxcb-cursor0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # - os: ubuntu-22.04   # oldest glibc we'd support: the build only runs on the same or newer
          #   platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libxcb-cursor0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Read version (and check it matches the tag)
        id: version
        run: |
          version=$(python -c "from app.__version__ import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/__version__.py ($version)"
            exit 1
          fi

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm superpos.spec

      # The exe is windowed (console=False): the shell wouldn't wait for it or
      # see its exit code, and its results only go to the log file.
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\SuperPOS\SuperPOS.exe -ArgumentList '--self-test' -Wait -PassThru
          Select-String -Path "$env:APPDATA\SuperPOS\logs\pos.log" -Pattern 'SELF-TEST'
          exit $p.ExitCode

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          code=0
          dist/SuperPOS/SuperPOS --self-test || code=$?
          grep 'SELF-TEST' ~/.local/share/SuperPOS/logs/pos.log
          exit $code

      - uses: actions/upload-artifact@v7
        with:
          name: SuperPOS-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: dist/SuperPOS/
          if-no-files-found: error

      # Only after the self-test passed: never package a build that can't print.
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\superpos.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SuperPOS-${{ steps.version.outputs.version }}-setup
          path: dist/SuperPOS-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: error
